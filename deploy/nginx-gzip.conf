# บีบอัดไฟล์ก่อนส่ง (Core Web Vitals) — ระดับ http ใช้กับทุก server block โดยไม่ต้องแก้ไฟล์ที่ certbot แก้ไว้แล้ว
# ติดตั้ง: sudo cp deploy/nginx-gzip.conf /etc/nginx/conf.d/letmehelp-gzip.conf && sudo nginx -t && sudo systemctl reload nginx
# gzip on; อยู่ใน /etc/nginx/nginx.conf ของ Ubuntu แล้ว (ใส่ซ้ำ nginx -t จะ error) — ไฟล์นี้เติมส่วนที่ยังปิดอยู่
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml font/ttf;
gzip_static on;   # ไฟล์ static: ส่ง .gz ที่ WhiteNoise สร้างไว้ตอน collectstatic
