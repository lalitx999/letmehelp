# __DOMAIN__ ถูกแทนด้วยโดเมนจริงตอนรัน setup_server.sh — certbot จะเติมส่วน HTTPS ให้เอง
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 20M;   # อัปโหลดสลิป / ไฟล์ประกอบการเรียน

    # static มีชื่อไฟล์แบบ hash (ManifestStaticFilesStorage) → แคชยาวได้
    location /static/ {
        alias /srv/letmehelp/app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ไฟล์สาธารณะ เช่น ปกคอร์ส — private_media ห้ามเสิร์ฟตรง (Django ตรวจสิทธิ์ก่อนส่ง)
    location /media/ {
        alias /srv/letmehelp/app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
