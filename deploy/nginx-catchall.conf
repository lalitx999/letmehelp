# ตัดคำขอที่ไม่ได้มาด้วยโดเมนของเว็บ (เช่น บอทสแกนที่ยิงด้วย IP ตรง) ที่ nginx เลย
# ไม่ให้ไปถึง Django จน log เต็มไปด้วย DisallowedHost — ติดตั้งเป็นไฟล์แยก ไม่ยุ่งกับส่วน HTTPS ที่ certbot เติม
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;   # HTTPS ด้วย IP: ตัดตั้งแต่ handshake ไม่ต้องมีใบรับรอง
    server_name _;
    return 444;
}
