<!doctype html>
<html lang="th">
<head>

  <title>ระบบขัดข้องชั่วคราว — Let Me Help</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #111;

    .box { background: #fff; border-radius: 20px; padding: 40px 28px; max-width: 480px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.06); }
    h1 { font-size: 1.5rem; margin: 0 0 12px; } p { color: #555; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; background: #111; color: #fff; text-decoration: none; padding: 10px 22px; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ระบบขัดข้องชั่วคราว</h1>
    <p>ขออภัยในความไม่สะดวก ทีมงานได้รับแจ้งแล้ว กรุณาลองใหม่อีกครั้งในอีกสักครู่</p>
    <a href="/">กลับหน้าแรก</a>
  </div>
</body>
</html>
