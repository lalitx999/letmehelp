{% extends "base.html" %}
{% load ui %}
{% block content %}
<section class="section">
  <div class="container" style="max-width: 52rem;">
    <nav class="crumbs mb-3" aria-label="breadcrumb"><a href="{% url 'core:home' %}">หน้าแรก</a> <span>/</span> <span>{% block legal_crumb %}{% endblock %}</span></nav>
    <span class="lbl d-block mb-2">( กฎหมายและความเป็นส่วนตัว )</span>
    <h1 class="h2 mb-2">{% block legal_title %}{% endblock %}</h1>
    <p class="text-secondary mb-4">อัปเดตล่าสุด {{ updated }} · {% block legal_switch %}{% endblock %}</p>
    <div class="legal">{% block legal_body %}{% endblock %}</div>
  </div>
</section>
{% endblock %}
